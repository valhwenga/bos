    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#12735c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1719" media="(prefers-color-scheme: dark)" />

    <script>
      // Apply the stored theme before first paint so dark mode doesn't flash
      // a light background on load.
      (function () {
        try {
          var mode = localStorage.getItem("ui.theme.mode");
          if (!mode) {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (mode === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
