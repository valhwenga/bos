server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: the router owns the URL, so any path the filesystem does
  # not have must return index.html. Without this, a refresh on
  # /accounting/invoices — or following a bookmark — returns 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so these can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must not be cached, or a deploy leaves browsers loading the old
  # one and asking for asset files that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
